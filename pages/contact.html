<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="校園外送｜聯絡客服或送出意見回饋，我們的服務團隊盡快回覆。" />
    <title>校園外送｜聯絡我們</title>
    <link rel="stylesheet" href="../css/base.css" />
    <style>
      .feedback-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        font-weight: 700;
        color: #1a2e22;
      }

      input,
      textarea {
        padding: 10px 14px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        color: #1a2e22;
        background: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #2e7d61;
        box-shadow: 0 0 0 3px rgba(46, 125, 97, 0.12);
      }

      textarea {
        resize: vertical;
      }

      .info-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .info-list li {
        padding: 10px 0;
        border-bottom: 1px solid #f0f3f7;
        font-size: 15px;
      }

      .info-list li:last-child {
        border-bottom: none;
      }

      .panel {
        border: none;
      }

      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">校園外送</a>
      <nav aria-label="主要導覽">
        <a href="restaurants.html">餐廳</a>
        <a href="menu.html">菜單</a>
        <a href="cart.html">購物車 <span data-cart-count>0</span></a>
        <a href="order-status.html">訂單狀態</a>
        <a href="profile.html">會員中心</a>
      </nav>
    </header>
    <main class="container">
      <section class="page-heading">
        <p class="eyebrow">需要協助嗎？</p>
        <h1>聯絡我們</h1>
        <p class="muted">這裡提供模擬客服資訊，方便你在原型中測試流程。</p>
      </section>

      <section class="panel">
        <div class="grid">
          <article class="card">
            <h2>客服資訊</h2>
            <ul class="info-list">
              <li><strong>服務時間：</strong>週一至週五 10:00–22:00</li>
              <li><strong>客服信箱：</strong>service@campusdelivery.example</li>
              <li><strong>常見問題：</strong><a href="#">配送說明</a>、<a href="#">退款流程</a></li>
            </ul>
          </article>

          <article class="card">
            <h2>意見回饋</h2>
            <form class="feedback-form">
              <div class="form-grid">
                <label>
                  姓名
                  <input type="text" placeholder="例如：同學A" />
                </label>
                <label>
                  電子信箱
                  <input type="email" placeholder="例如：student@example.com" />
                </label>
              </div>
              <label>
                問題內容
                <textarea rows="4" placeholder="請輸入你的問題或建議"></textarea>
              </label>
              <button type="button">送出意見</button>
              <p class="muted">這是測試用表單，不會真的寄出任何資料。</p>
            </form>
          </article>
        </div>
      </section>
    </main>
    <footer>校園外送小組協作練習</footer>
    <script src="../js/app.js"></script>
    <script>
      document.querySelector('.feedback-form button').addEventListener('click', function () {
        this.textContent = '✅ 意見已送出！';
        this.style.background = '#236151';
        this.disabled = true;
      });
    </script>
  </body>
</html>
