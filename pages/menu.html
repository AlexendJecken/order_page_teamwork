<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校園外送｜菜單</title>
    <link rel="stylesheet" href="../css/base.css" />
    <style>
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.25rem;
        margin-top: 1rem;
      }
      .menu-card {
        border: 1px solid #e2e2e2;
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background: #fff;
      }
      .menu-card h3 {
        margin: 0;
      }
      .menu-card .price {
        font-weight: bold;
        color: #d35400;
      }
      .menu-card button {
        margin-top: auto;
        cursor: pointer;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 8px;
        background: #2e7d32;
        color: #fff;
        font-size: 1rem;
      }
      .menu-card button:hover {
        background: #256428;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">校園外送</a>
      <nav aria-label="主要導覽"><a href="restaurants.html">餐廳</a><a href="cart.html">購物車 <span data-cart-count>0</span></a><a href="../index.html">首頁</a></nav>
    </header>
    <main class="container">
      <section class="page-heading"><p class="eyebrow">本日菜單</p><h1>晴天咖啡</h1><p class="muted">挑選餐點後，按下按鈕加入購物車。</p></section>
      <p class="status-message" data-status-message aria-live="polite"></p>

      <section class="menu-list">
        <h2>餐點列表</h2>
        <div class="menu-grid">
          <article class="menu-card">
            <h3>經典美式漢堡</h3>
            <p>100% 純牛肉排，搭配生菜、番茄與特製醬料，經典不敗的選擇。</p>
            <p class="price">NT$ 120</p>
            <button type="button" data-add-to-cart data-item-name="經典美式漢堡" data-item-price="120">
              加入購物車
            </button>
          </article>

          <article class="menu-card">
            <h3>義式番茄燉飯</h3>
            <p>選用新鮮番茄與帕瑪森起司慢火燉煮，濃郁香醇，飯粒Q彈。</p>
            <p class="price">NT$ 150</p>
            <button type="button" data-add-to-cart data-item-name="義式番茄燉飯" data-item-price="150">
              加入購物車
            </button>
          </article>

          <article class="menu-card">
            <h3>季節水果沙拉</h3>
            <p>當季新鮮水果搭配優格醬，清爽開胃，健康無負擔。</p>
            <p class="price">NT$ 90</p>
            <button type="button" data-add-to-cart data-item-name="季節水果沙拉" data-item-price="90">
              加入購物車
            </button>
          </article>
        </div>
      </section>
    </main>
    <footer>校園外送小組協作練習</footer><script src="../js/app.js"></script>
    <script>
      // 若 app.js 尚未實作 data-add-to-cart 的行為，這裡提供備援邏輯，
      // 確保「點擊按鈕時顯示已加入的提示」的驗收條件可以獨立運作。
      (function () {
        var statusEl = document.querySelector("[data-status-message]");
        var cartCountEl = document.querySelector("[data-cart-count]");
        var count = parseInt(cartCountEl && cartCountEl.textContent, 10) || 0;

        document.querySelectorAll("[data-add-to-cart]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var name = btn.getAttribute("data-item-name") || "餐點";
            count += 1;
            if (cartCountEl) cartCountEl.textContent = count;
            if (statusEl) {
              statusEl.textContent = "已將「" + name + "」加入購物車！";
            }
          });
        });
      })();
    </script>
  </body>
</html>
