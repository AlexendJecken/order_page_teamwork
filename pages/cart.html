<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校園外送｜購物車</title>
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html">校園外送</a>
      <nav aria-label="主要導覽"><a href="menu.html">菜單</a><a href="order-status.html">訂單狀態</a><a href="../index.html">首頁</a></nav>
    </header>
    <main class="container">
      <section class="page-heading">
        <p class="eyebrow">訂單確認</p>
        <h1>購物車</h1>
        <p class="muted">這是前台原型，不會真的送出訂單。</p>
      </section>

      <section class="panel">
        <div class="grid">
          <article class="card">
            <h2>購物車摘要</h2>
            <ul class="summary-list">
              <li class="summary-item">
                <div class="summary-row"><span>香雞漢堡</span><span>NT$ 95</span></div>
              </li>
              <li class="summary-item">
                <div class="summary-row"><span>可樂</span><span>NT$ 25</span></div>
              </li>
            </ul>
            <div class="summary-row"><span>運費</span><span>NT$ 40</span></div>
            <div class="summary-row total"><span>總金額</span><span>NT$ 160</span></div>
            <button type="button">模擬下單</button>
          </article>

          <article class="card">
            <h2>配送資訊</h2>
            <p>配送地點：校園行政大樓 3F</p>
            <p>付款方式：學生支付卡</p>
            <p class="muted">下單後將進入訂單狀態頁面確認流程。</p>
          </article>
        </div>
      </section>
    </main>
    <footer>校園外送小組協作練習</footer>
    <script src="../js/app.js"></script>
  </body>
</html>
